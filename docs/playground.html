<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mist Playground - Enhanced MySQL Engine</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.0/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.0/theme/monokai.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.0/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.0/mode/sql/sql.min.js"></script>
    <style>
        .playground-main {
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        .playground-header {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--background);
        }

        .playground-grid {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0;
            overflow: hidden;
        }

        .panel {
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border);
            background: var(--background);
        }

        .panel:last-child {
            border-right: none;
        }

        .panel-header {
            padding: 0.75rem 1rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--muted);
        }

        .panel-title {
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--foreground);
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        .editor-container {
            flex: 1;
            position: relative;
        }

        .CodeMirror {
            height: 100% !important;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
        }

        .playground-toolbar {
            padding: 0.75rem 1rem;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 0.5rem;
            align-items: center;
            flex-wrap: wrap;
        }

        .results-container {
            flex: 1;
            overflow: auto;
            padding: 1rem;
        }

        .result-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.875rem;
        }

        .result-table th {
            text-align: left;
            padding: 0.5rem;
            border-bottom: 2px solid var(--border);
            color: var(--muted-foreground);
            font-weight: 600;
        }

        .result-table td {
            padding: 0.5rem;
            border-bottom: 1px solid var(--border);
            color: var(--foreground);
        }

        .wasm-status-badge {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.75rem;
            font-weight: 500;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            background: var(--muted);
            border: 1px solid var(--border);
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #ef4444;
        }

        .status-dot.ready {
            background: #10b981;
        }

        @media (max-width: 1024px) {
            .playground-grid {
                grid-template-columns: 1fr;
                overflow: auto;
            }

            .panel {
                height: 500px;
                border-right: none;
                border-bottom: 1px solid var(--border);
            }
        }
    </style>
</head>

<body>
    <div class="layout-wrapper">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <img src="mist-icon.svg" alt="Mist" class="sidebar-logo">
                <span class="sidebar-brand-text">Mist</span>
            </div>
            <nav class="sidebar-nav">
                <a href="index.html" class="sidebar-link">
                    <i class="fa-solid fa-house"></i> Home
                </a>
                <a href="mysql_compatibility.html" class="sidebar-link">
                    <i class="fa-solid fa-check-double"></i> Compatibility
                </a>
                <a href="#" class="sidebar-link active">
                    <i class="fa-solid fa-play"></i> Playground
                </a>
                <a href="https://github.com/abbychau/mist" target="_blank" class="sidebar-link">
                    <i class="fa-brands fa-github"></i> GitHub
                </a>
                <hr style="border: 0; border-top: 1px solid var(--border); margin: 1rem 0;">
                <div
                    style="padding: 0 1rem; font-size: 0.75rem; color: var(--muted-foreground); font-weight: 600; margin-bottom: 0.5rem;">
                    QUICK EXAMPLES</div>
                <a href="javascript:loadExample('basics')" class="sidebar-link">Table Basics</a>
                <a href="javascript:loadExample('subqueries')" class="sidebar-link">Subqueries</a>
                <a href="javascript:loadExample('fk')" class="sidebar-link">Foreign Keys</a>
                <a href="javascript:loadExample('functions')" class="sidebar-link">Functions</a>
                <a href="javascript:loadExample('unions')" class="sidebar-link">Set Ops (UNION)</a>
                <a href="javascript:loadExample('tx')" class="sidebar-link">Transactions</a>
            </nav>
        </aside>

        <!-- Main Content (Dashboard) -->
        <main class="main-content" style="padding: 0;">
            <div class="playground-main">
                <div class="playground-header">
                    <div>
                        <h1 style="font-size: 1.125rem; font-weight: 700;">SQL Playground</h1>
                        <p style="font-size: 0.8125rem; color: var(--muted-foreground); margin-top: 0.125rem;">Full
                            MySQL Engine in WebAssembly</p>
                    </div>
                    <div class="wasm-status-badge">
                        <span class="status-dot" id="wasmStatus"></span>
                        <span id="wasmStatusText">Connecting...</span>
                    </div>
                </div>

                <div class="playground-grid">
                    <!-- Left Panel: Editor -->
                    <div class="panel">
                        <div class="panel-header">
                            <span class="panel-title">Editor</span>
                        </div>
                        <div class="editor-container">
                            <textarea id="sqlEditor">-- Execute multiple SQL statements here
CREATE TABLE users (id INT AUTO_INCREMENT PRIMARY KEY, name VARCHAR(100));
INSERT INTO users (name) VALUES ('Alice'), ('Bob');
SELECT * FROM users;</textarea>
                        </div>
                        <div class="playground-toolbar">
                            <button class="btn btn-primary" id="executeBtn" style="padding: 0.5rem 1.25rem;">
                                Run Query
                            </button>
                            <button class="btn btn-secondary" id="clearBtn" style="padding: 0.5rem 1rem;">Clear</button>
                            <button class="btn btn-destructive" id="dropAllBtn" style="padding: 0.5rem 1rem;">Drop
                                All</button>
                            <div style="flex: 1;"></div>
                            <button class="btn btn-secondary" id="downloadSnapshotBtn"
                                style="padding: 0.5rem 1rem;">Export</button>
                            <button class="btn btn-secondary" id="uploadSnapshotBtn"
                                style="padding: 0.5rem 1rem;">Import</button>
                            <input type="file" id="snapshotInput" style="display: none;" accept=".bin,.db,.snapshot">
                        </div>
                    </div>

                    <!-- Right Panel: Results -->
                    <div class="panel">
                        <div class="panel-header">
                            <span class="panel-title">Results</span>
                            <span id="executionTime" style="font-size: 0.75rem; color: var(--muted-foreground);"></span>
                        </div>
                        <div class="results-container" id="resultsContent">
                            <div style="color: var(--muted-foreground); font-size: 0.875rem;">
                                No queries executed. Run a query to see results.
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="wasm_exec.js"></script>
    <script>
        let wasmReady = false;

        async function initWASM() {
            try {
                const go = new Go();
                const result = await WebAssembly.instantiateStreaming(fetch('mist.wasm'), go.importObject);
                go.run(result.instance);

                let attempts = 0;
                while (!window.executeSQL && attempts < 100) {
                    await new Promise(r => setTimeout(r, 200));
                    attempts++;
                }

                if (window.executeSQL) {
                    wasmReady = true;
                    document.getElementById('wasmStatus').classList.add('ready');
                    document.getElementById('wasmStatusText').textContent = 'WASM Ready';
                }
            } catch (e) {
                console.error(e);
                document.getElementById('wasmStatusText').textContent = 'Demo Mode';
            }
        }

        const editor = CodeMirror.fromTextArea(document.getElementById('sqlEditor'), {
            mode: 'sql',
            theme: 'monokai',
            lineNumbers: true,
            indentUnit: 4,
            lineWrapping: true,
            matchBrackets: true,
            autoCloseBrackets: true,
        });

        async function executeQuery() {
            const query = editor.getValue().trim();
            if (!query) return;

            const executeBtn = document.getElementById('executeBtn');
            const resultsContent = document.getElementById('resultsContent');
            const executionTime = document.getElementById('executionTime');

            executeBtn.disabled = true;
            executeBtn.textContent = 'Running...';

            const start = performance.now();

            try {
                if (wasmReady && window.executeSQL) {
                    const jsonResult = window.executeSQL(query);
                    const result = JSON.parse(jsonResult);
                    const duration = (performance.now() - start).toFixed(1);
                    executionTime.textContent = `${duration}ms`;

                    if (result.error) {
                        displayError(result.error);
                    } else {
                        displayResult(result);
                    }
                } else {
                    displayError("WASM not ready. Please wait or refresh.");
                }
            } catch (e) {
                displayError(e.message);
            } finally {
                executeBtn.disabled = false;
                executeBtn.textContent = 'Run Query';
            }
        }

        function displayResult(result) {
            const resultsContent = document.getElementById('resultsContent');
            resultsContent.innerHTML = '';

            if (result.type === 'select') {
                const table = document.createElement('table');
                table.className = 'result-table';

                const thead = document.createElement('thead');
                const htr = document.createElement('tr');
                result.columns.forEach(c => {
                    const th = document.createElement('th');
                    th.textContent = c;
                    htr.appendChild(th);
                });
                thead.appendChild(htr);
                table.appendChild(thead);

                const tbody = document.createElement('tbody');
                result.rows.forEach(r => {
                    const tr = document.createElement('tr');
                    r.forEach(cell => {
                        const td = document.createElement('td');
                        td.textContent = cell;
                        tr.appendChild(td);
                    });
                    tbody.appendChild(tr);
                });
                table.appendChild(tbody);
                resultsContent.appendChild(table);
            } else {
                resultsContent.innerHTML = `<div style="color: #10b981; font-size: 0.875rem;">${result.message}</div>`;
            }
        }

        function displayError(msg) {
            resultsContent.innerHTML = `<div style="color: #ef4444; font-size: 0.875rem;">Error: ${msg}</div>`;
        }

        function loadExample(type) {
            const examples = {
                basics: "-- Basic Table creation and Data Manipulation\nCREATE TABLE products (id INT AUTO_INCREMENT PRIMARY KEY, name VARCHAR(50), price FLOAT);\nINSERT INTO products (name, price) VALUES ('Widget A', 29.99), ('Gadget B', 49.50), ('Tool C', 15.00);\nSELECT * FROM products WHERE price > 20 ORDER BY price DESC;",
                subqueries: "-- Correlated and non-correlated scalar subqueries\nCREATE TABLE users (id INT PRIMARY KEY, name VARCHAR(50));\nCREATE TABLE orders (id INT PRIMARY KEY, user_id INT, amount FLOAT);\nINSERT INTO users VALUES (1, 'Alice'), (2, 'Bob');\nINSERT INTO orders VALUES (101, 1, 50.0), (102, 1, 30.0), (103, 2, 90.0);\n-- Show each user with their total order count using a correlated subquery\nSELECT name, (SELECT COUNT(*) FROM orders WHERE user_id = users.id) AS order_count FROM users;",
                fk: "-- Foreign Key constraints and Cascade Deletes\nCREATE TABLE categories (id INT PRIMARY KEY, name VARCHAR(30));\nCREATE TABLE items (id INT PRIMARY KEY, cat_id INT, name VARCHAR(30), FOREIGN KEY (cat_id) REFERENCES categories(id) ON DELETE CASCADE);\nINSERT INTO categories VALUES (1, 'Electronics'), (2, 'Books');\nINSERT INTO items VALUES (1, 1, 'Laptop'), (2, 1, 'Phone'), (3, 2, 'SQL Guide');\n-- Delete a category, and its items will disappear due to ON DELETE CASCADE\nDELETE FROM categories WHERE id = 1;\nSELECT * FROM items;",
                functions: "-- String, Math, and Date functions\nCREATE TABLE employees (id INT PRIMARY KEY, name VARCHAR(50), hire_date DATE, salary FLOAT);\nINSERT INTO employees VALUES (1, 'john doe', '2023-01-15', 55000.0);\nSELECT \n    UPPER(name) AS name_upper, \n    LENGTH(name) AS name_len, \n    YEAR(hire_date) AS joined_year, \n    ROUND(salary / 12, 2) AS monthly_salary\nFROM employees;",
                unions: "-- Set Operations: UNION and UNION ALL\nCREATE TABLE active_users (id INT, name VARCHAR(50));\nCREATE TABLE archive_users (id INT, name VARCHAR(50));\nINSERT INTO active_users VALUES (1, 'Alice'), (2, 'Bob');\nINSERT INTO archive_users VALUES (3, 'Charlie'), (1, 'Alice');\n-- UNION removes duplicates, UNION ALL keeps them\nSELECT name FROM active_users \nUNION \nSELECT name FROM archive_users;",
                tx: "-- Transactions with Savepoints and Rollbacks\nCREATE TABLE accounts (id INT PRIMARY KEY, balance FLOAT);\nINSERT INTO accounts VALUES (1, 1000.0), (2, 500.0);\nSTART TRANSACTION;\nUPDATE accounts SET balance = balance - 100 WHERE id = 1;\nSAVEPOINT p1;\nUPDATE accounts SET balance = balance + 100 WHERE id = 2;\n-- Oops, wrong recipient! Rollback to savepoint.\nROLLBACK TO SAVEPOINT p1;\nCOMMIT;\nSELECT * FROM accounts;"
            };
            editor.setValue(examples[type]);
            executeQuery();
        }

        async function downloadSnapshot() {
            if (!wasmReady || !window.getSnapshot) return;
            const data = window.getSnapshot();
            const blob = new Blob([data], { type: 'application/octet-stream' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `mist_snapshot.snapshot`;
            a.click();
            URL.revokeObjectURL(url);
        }

        async function uploadSnapshot(event) {
            const file = event.target.files[0];
            if (!file || !wasmReady || !window.loadSnapshot) return;
            const reader = new FileReader();
            reader.onload = e => {
                const data = new Uint8Array(e.target.result);
                const res = JSON.parse(window.loadSnapshot(data));
                if (res.error) displayError(res.error);
                else {
                    displayResult({ type: 'message', message: 'Snapshot loaded successfully' });
                }
            };
            reader.readAsArrayBuffer(file);
        }

        document.getElementById('executeBtn').onclick = executeQuery;
        document.getElementById('clearBtn').onclick = () => {
            editor.setValue('');
            document.getElementById('resultsContent').innerHTML = '<div style="color: var(--muted-foreground); font-size: 0.875rem;">No queries executed. Run a query to see results.</div>';
            document.getElementById('executionTime').textContent = '';
        };
        document.getElementById('dropAllBtn').onclick = async () => {
            if (!confirm('Are you sure you want to drop all tables? This cannot be undone.')) return;
            try {
                if (wasmReady && window.executeSQL) {
                    const tablesJson = window.executeSQL("SHOW TABLES;");
                    const tablesRes = JSON.parse(tablesJson);
                    if (tablesRes.error) {
                        displayError(tablesRes.error);
                        return;
                    }

                    if (tablesRes.rows && tablesRes.rows.length > 0) {
                        for (const row of tablesRes.rows) {
                            const tableName = row[0];
                            window.executeSQL(`DROP TABLE IF EXISTS \`${tableName}\`;`);
                        }
                        displayResult({ type: 'message', message: `Successfully dropped ${tablesRes.rows.length} table(s).` });
                    } else {
                        displayResult({ type: 'message', message: 'No tables to drop.' });
                    }
                }
            } catch (e) {
                displayError(e.message);
            }
        };
        document.getElementById('downloadSnapshotBtn').onclick = downloadSnapshot;
        document.getElementById('uploadSnapshotBtn').onclick = () => document.getElementById('snapshotInput').click();
        document.getElementById('snapshotInput').onchange = uploadSnapshot;

        initWASM();
    </script>
</body>

</html>
